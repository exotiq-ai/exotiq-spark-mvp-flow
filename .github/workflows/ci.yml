name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Lint is informational until the pre-existing backlog of ~737 errors
      # (mostly no-explicit-any in Lovable-generated code) is paid down.
      # Typecheck, tests, and build are the gating steps.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: External booking strict runtime typecheck
        run: npx tsc -p tsconfig.external-api.json

      - name: External booking canonical documentation
        run: node scripts/agent-booking/generate-contract.mjs --check

      - name: External booking offline safety and contract tests
        run: |
          npm run test:agent:unit
          npm run test:agent:contract

      - name: Renter MCP pinned dependencies and compatibility
        run: |
          npm --prefix packages/renter-mcp ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/renter-mcp run typecheck
          npm --prefix packages/renter-mcp test
          npm --prefix packages/renter-mcp run build

      - name: Build
        run: npm run build
